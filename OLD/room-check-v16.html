<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>룸 체크</title>
<style>
  :root{
    --paper:#E7EBEA;--surface:#FCFCFB;--ink:#16232B;--sub:#3E4E56;--muted:#5C6B72;
    --line:#D3D9D7;--brand:#0B6E6B;--brandDark:#095855;
    --av:#2F7A55;--avBg:#E4F0E9;--rq:#B07908;--rqBg:#F6EBD4;--so:#AE4238;--soBg:#F3E1DE;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .eyebrow{font-size:11px;letter-spacing:.5px;color:var(--brand);font-weight:700;text-transform:uppercase}
  h1{font-size:29px;font-weight:800;letter-spacing:-.6px;line-height:1.05;margin:4px 0 0}
  .lede{color:var(--muted);font-size:13px;margin:4px 0 0}
  .label{font-size:10.5px;letter-spacing:.3px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  select,input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;color:var(--ink);font-size:14.5px;font-family:var(--sans);outline:none;-webkit-appearance:none;appearance:none}
  textarea{min-height:64px;resize:vertical;line-height:1.5}
  input[type=number],input[type=date]{font-family:var(--mono)}
  .flex{display:flex}.aic{align-items:center}.between{justify-content:space-between}
  .line{display:grid;gap:9px;margin-top:12px}
  .l3{grid-template-columns:1fr 1fr 1fr}.l2{grid-template-columns:1fr 1fr}
  .seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--sans)}
  .seg button.on{background:var(--brand);color:#fff}
  .regchip{display:flex;align-items:center;justify-content:space-between;background:var(--avBg);border:1px solid #2F7A5533;color:var(--av);font-weight:700;font-size:14px;border-radius:9px;padding:9px 11px}
  .tag{font-size:9.5px;font-weight:800;background:var(--av);color:#fff;border-radius:5px;padding:1px 5px;letter-spacing:.4px}
  .autobox{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--mono);font-size:14px}
  .hblock{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
  .bnum{font-family:var(--mono);font-size:12px;color:var(--brand);font-weight:800;margin-bottom:8px}
  .datebox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper);font-family:var(--mono);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dv{color:var(--ink);font-weight:600;letter-spacing:.3px;font-size:14.5px}
  .arrow{color:var(--muted);font-weight:700}
  .del{width:34px;height:34px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:17px;cursor:pointer}
  .linkbtn{margin-top:2px;font-size:13px;font-weight:700;color:var(--brand);background:none;border:none;cursor:pointer;padding:6px 0}
  .memo{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
  .memohead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;background:var(--surface);font-weight:700;font-size:14px}
  .memobody{padding:0 12px 12px;background:var(--surface)}
  .cta{margin-top:14px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15.5px;font-weight:800;cursor:pointer}
  .cta:active{background:var(--brandDark)}
  .mono{font-family:var(--mono)} .small{font-size:12px;color:var(--muted)}
  .wsintro{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .wsintro .l{font-size:13px;color:var(--sub);line-height:1.7}
  .wscard{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
  .wshead{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer}
  .chev{width:16px;flex:0 0 auto;color:var(--muted);font-size:12px;transition:transform .15s}
  .chev.open{transform:rotate(90deg)}
  .hmeta{flex:1;min-width:0}
  .hn{font-weight:800;font-size:15px;line-height:1.2}
  .rt{font-size:12px;color:var(--muted);margin-top:2px}
  .stsel{width:70px;flex:0 0 auto;padding:8px 6px;font-weight:800;font-size:13px;text-align:center;font-family:var(--mono)}
  .stsel.st-av{background:var(--avBg);border-color:var(--av);color:var(--av)}
  .stsel.st-rq{background:var(--rqBg);border-color:var(--rq);color:var(--rq)}
  .stsel.st-so{background:var(--soBg);border-color:var(--so);color:var(--so)}
  .pbox{display:flex;align-items:center;gap:3px;width:92px;flex:0 0 auto}
  .pbox span{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .pbox input{padding:8px 8px;font-size:13px;text-align:right}
  .detail{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--paper)}
  .dhdr{font-size:12px;color:var(--muted);margin:4px 0 8px;font-family:var(--mono)}
  .drow{display:flex;align-items:center;gap:8px;padding:5px 0}
  .ddate{font-family:var(--mono);font-size:12.5px;color:var(--sub);width:100px;flex:0 0 auto}
  .legend{display:flex;gap:14px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .legend b{font-family:var(--mono)}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
  .brow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
  .brow.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:800;font-size:16px}
  .curbtn{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;padding:8px 6px;font-weight:800;font-size:12px;cursor:pointer;width:42px;flex:0 0 auto;font-family:var(--mono)}
  .curbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .addrow{display:flex;gap:7px;align-items:center;margin-top:7px}
  .quotecard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:12px}
  .qc-title{font-size:12px;letter-spacing:1px;color:var(--brand);font-weight:800;text-transform:uppercase}
  .qc-leg{margin-top:14px}
  .qc-leg .qc-d{font-family:var(--mono);font-size:13.5px;color:var(--muted);font-weight:700}
  .qc-leg .qc-h{font-size:15.5px;font-weight:800;margin-top:2px}
  .qc-rowline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
  .qc-leg .qc-r{font-size:13px;color:var(--sub)}
  .qc-leg .qc-req{font-size:13px;color:var(--brand);font-weight:700;white-space:nowrap}
  .qc-price{font-size:12.5px;color:var(--sub);margin-top:3px;font-family:var(--mono)}
  .qc-inc{font-size:13px;color:var(--sub);margin-top:4px}
  .qc-sep{border:0;border-top:1px dashed var(--line);margin:16px 0}
  .qc-final{display:flex;justify-content:space-between;align-items:baseline}
  .qc-final .lbl{font-size:14px;font-weight:700;color:var(--sub)}
  .qc-final .amt{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
  .qc-sub{font-size:11.5px;color:var(--muted);text-align:right;margin-top:2px;font-family:var(--mono)}
  .qbtns{display:flex;gap:9px;margin-top:12px}
  .qbtns button{flex:1;border:none;border-radius:11px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer}
  .qcopy{background:var(--brand);color:#fff}
  .qimg{background:var(--ink);color:#fff}
  .optitem{border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:7px;background:var(--surface)}
  .optitem .toprow{display:flex;align-items:center;gap:6px}
  .optline{display:flex;align-items:center;gap:6px;margin-top:8px}
  .optline input[type=number]{width:80px;flex:0 0 auto;font-family:var(--mono);text-align:right;padding:8px}
  .optline .qty{width:52px}
  .optline select{width:56px;flex:0 0 auto;padding:8px 4px;font-family:var(--mono);text-align:center}
  .optline .x{color:var(--muted);font-weight:700}
  .linetot{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:13.5px;color:var(--ink);white-space:nowrap}
  .chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;white-space:nowrap}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">THE NIRVANA · 룸 오퍼레이션</div>
    <h1>룸 체크</h1>
    <p class="lede">문의를 만들면, 직원이 호텔 확인 후 상태·요금을 입력합니다.</p>
  </header>

  <section class="card">
    <div class="label">조회 방식</div>
    <div class="seg" id="mode">
      <button data-v="parallel">① 같은 기간 · 여러 호텔</button>
      <button data-v="multi" class="on">② 연박 일정</button>
    </div>

    <div class="line l3">
      <div><div class="label">등록자</div><div class="regchip">심은선 <span class="tag">자동</span></div></div>
      <div><div class="label">에이전트</div><input id="agent" placeholder="선택"></div>
      <div><div class="label">담당자</div><input id="manager" placeholder="선택"></div>
    </div>

    <div class="line l2">
      <div><div class="label">체크인 (시작일)</div><input type="date" id="startDate" value="2026-09-16"></div>
      <div><div class="label">총 박수</div><div id="totalWrap"></div></div>
    </div>

    <div style="margin-top:16px" class="flex between aic">
      <div class="label" style="margin:0">호텔 <span id="rowHint" class="small"></span></div>
    </div>
    <div id="rows" style="margin-top:8px"></div>
    <datalist id="optdl"><option>올인</option><option>올인 2회</option><option>풀보드</option><option>하프보드</option><option>조식 포함</option><option>허니문 세팅</option><option>고층 요청</option><option>커넥팅룸</option><option>레이트 체크아웃</option><option>얼리 체크인</option><option>패스트 트랙</option><option>VIP 라운지</option><option>공항 픽업</option></datalist>
    <button id="addRow" class="linkbtn">+ 호텔 추가</button>

    <div class="memo">
      <div class="memohead" id="notesHead"><span class="chev" id="notesChev">▶</span> 메모 / 특별 요청</div>
      <div class="memobody" id="notesBody" style="display:none"><textarea id="notes" placeholder="예: 허니문 세팅, 고층 요청, 커넥팅룸, 레이트 체크아웃 ..."></textarea></div>
    </div>

    <button id="run" class="cta">가용 여부 조회</button>
  </section>

  <section id="worksheet"></section>
  <section id="quote"></section>
</div>

<div id="toast" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#14202B;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const HOTELS=[
 {name:"마이카오락 비치 리조트",region:"카오락",rooms:["디럭스","디럭스 풀액세스","주니어 스위트"]},
 {name:"로빈슨 클럽 카오락",region:"카오락",rooms:["디럭스","풀빌라","비치프론트"]},
 {name:"카오락 에메랄드 비치 리조트",region:"카오락",rooms:["디럭스","프리미어 디럭스","풀액세스"]},
 {name:"JW 메리어트 카오락",region:"카오락",rooms:["디럭스","풀액세스","풀빌라"]},
 {name:"카오락 메리어트 비치 리조트",region:"카오락",rooms:["디럭스","풀액세스","이그제큐티브"]},
 {name:"카타타니 푸켓 비치 리조트",region:"푸켓",rooms:["디럭스","씨뷰","풀 스위트"]},
 {name:"더 쇼어 앳 카타타니",region:"푸켓",rooms:["풀빌라","오션프론트 풀빌라"]},
 {name:"로얄 클리프 비치 호텔",region:"파타야",rooms:["디럭스","씨뷰","스위트"]},
 {name:"아바니 파타야",region:"파타야",rooms:["디럭스","풀액세스"]},
];
const GENERIC=["디럭스","슈페리어","풀액세스","풀빌라","주니어 스위트","스위트","씨뷰","비치프론트","오션뷰"];
const REGIONS=["전체","카오락","푸켓","파타야"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDK=["일","월","화","수","목","금","토"];
const STOPT=[["","–"],["av","AV"],["rq","RQ"],["so","S/O"]];
const STCLS={av:"st-av",rq:"st-rq",so:"st-so","":""};

let s={mode:"multi",startDate:"2026-09-16",sharedNights:3,agent:"베리굿",manager:"",notes:"",notesOpen:false,
  rows:[{id:1,region:"카오락",hotel:"마이카오락 비치 리조트",roomType:"디럭스",rooms:1,nights:3,note:"",memoOpen:false,showRate:false,options:[{id:11,name:"올인",qty:2,amt:0,show:true,memo:""}]},
        {id:2,region:"카오락",hotel:"로빈슨 클럽 카오락",roomType:"풀빌라",rooms:1,nights:2,note:"",memoOpen:false,showRate:false,options:[{id:21,name:"풀보드",qty:1,amt:0,show:true,memo:""}]}],
  ws:{}, open:new Set([2]), recordOpen:true,
  quote:{rate:40,pax:2,addl:[{id:2,desc:"패스트 트랙 + VIP 라운지",amt:5250,qty:1,cur:'thb',show:false,memo:""}],override:null}};

const _utc=iso=>{const p=iso.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))};
const addDays=(iso,n)=>{const d=_utc(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtD=iso=>{const d=_utc(iso);return String(d.getUTCDate()).padStart(2,'0')+MON[d.getUTCMonth()]+String(d.getUTCFullYear()).slice(2)};
const wdk=iso=>WDK[_utc(iso).getUTCDay()];
const dstr=iso=>fmtD(iso)+" "+wdk(iso);
const esc=v=>(v||'').replace(/"/g,'&quot;');
const opt=(v,t,sel)=>'<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+t+'</option>';
const hotelsIn=r=>r==="전체"?HOTELS:HOTELS.filter(h=>h.region===r);
const roomsFor=name=>{const h=HOTELS.find(x=>x.name===name);return h?h.rooms:GENERIC;};
function rowDates(row,i){let checkIn,nights;
  if(s.mode==="parallel"){checkIn=s.startDate;nights=Number(s.sharedNights);}
  else{let off=0;for(let k=0;k<i;k++)off+=Number(s.rows[k].nights);checkIn=addDays(s.startDate,off);nights=Number(row.nights);}
  return {checkIn,checkOut:addDays(checkIn,nights),nights,dates:Array.from({length:nights},(_,k)=>addDays(checkIn,k))};}
const totalNights=()=>s.mode==="parallel"?Number(s.sharedNights):s.rows.reduce((a,r)=>a+Number(r.nights),0);

function render(){
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.v===s.mode));
  document.getElementById('startDate').value=s.startDate;
  document.getElementById('agent').value=s.agent;
  document.getElementById('manager').value=s.manager;
  document.getElementById('totalWrap').innerHTML = s.mode==="parallel"
    ? '<input type="number" id="sharedNights" min="1" value="'+s.sharedNights+'">'
    : '<div class="autobox">'+totalNights()+'박 <span class="tag" style="background:var(--brand)">자동</span></div>';
  if(s.mode==="parallel") document.getElementById('sharedNights').onchange=e=>{s.sharedNights=Math.max(1,Number(e.target.value));render();};
  document.getElementById('rowHint').textContent=s.mode==="parallel"?"· 모두 같은 기간":"· 앞 호텔 체크아웃 = 다음 호텔 체크인";

  document.getElementById('rows').innerHTML=s.rows.map((row,i)=>{
    const d=rowDates(row,i);
    const rlist=REGIONS.map(r=>opt(r,r,r===row.region)).join("");
    const hdl=hotelsIn(row.region).map(h=>'<option value="'+esc(h.name)+'">').join("");
    const rdl=roomsFor(row.hotel).map(r=>'<option value="'+esc(r)+'">').join("");
    const nightsInput = s.mode==="multi"
      ? '<input type="number" class="inNights" min="1" value="'+row.nights+'">'
      : '<input type="number" value="'+s.sharedNights+'" disabled style="opacity:.6">';
    return '<div class="hblock" data-id="'+row.id+'"><div class="bnum">호텔 '+(i+1)+'</div>'
      +'<div class="line l3" style="margin-top:0">'
        +'<div><div class="label">지역</div><select class="selRegion">'+rlist+'</select></div>'
        +'<div><div class="label">호텔 (선택·입력)</div><input class="inHotel" list="hdl'+row.id+'" value="'+esc(row.hotel)+'" placeholder="호텔명"><datalist id="hdl'+row.id+'">'+hdl+'</datalist></div>'
        +'<div><div class="label">룸타입 (선택·입력)</div><input class="inRoom" list="rdl'+row.id+'" value="'+esc(row.roomType)+'" placeholder="룸타입"><datalist id="rdl'+row.id+'">'+rdl+'</datalist></div></div>'
      +'<div style="margin-top:10px"><div class="label">날짜</div><div class="datebox">'
        +'<span class="dv">'+dstr(d.checkIn)+'</span><span class="arrow">→</span><span class="dv">'+dstr(d.checkOut)+'</span></div></div>'
      +'<div class="line l2" style="margin-top:10px">'
        +'<div><div class="label">박수</div>'+nightsInput+'</div>'
        +'<div><div class="label">객실수</div><input type="number" class="inRooms" min="1" value="'+row.rooms+'"></div></div>'
      +'<div style="margin-top:10px"><div class="label">호텔 추가 옵션 (내용 · 회수)</div>'
        + (row.options||[]).map(o=>'<div class="flex aic" style="gap:6px;margin-bottom:6px" data-optid="'+o.id+'"><input class="inOptName" list="optdl" style="flex:1" value="'+esc(o.name)+'" placeholder="옵션 이름"><input type="number" class="inOptQty" min="1" style="width:64px;flex:0 0 auto;text-align:center" value="'+(o.qty||1)+'" title="회수"><button class="del optDel">−</button></div>').join("")
        + '<button class="linkbtn addOpt">+ 옵션 추가</button></div>'
      +'<div class="flex" style="justify-content:flex-end;margin-top:9px"><button class="del btnDel">−</button></div></div>';
  }).join("");
  bindRows();
}
function bindRows(){
  document.querySelectorAll('#rows .hblock').forEach(el=>{
    const id=Number(el.dataset.id),row=s.rows.find(r=>r.id===id);

function overall(row,i){const d=rowDates(row,i);let st=[],pr=[];
  d.dates.forEach(iso=>{const c=s.ws[row.id+'|'+iso]||{};st.push(c.status||"");pr.push(c.price||"");});
  const us=[...new Set(st)],up=[...new Set(pr)];
  return {status:us.length===1?us[0]:"__mix",price:up.length===1?up[0]:"__mix",dates:d.dates,d};}
function stSel(cls,val,attrs,mixed){let o=STOPT.map(([v,t])=>opt(v,t,val===v)).join("");
  if(mixed)o='<option value="__mix" selected>혼합</option>'+o;
  return '<select class="'+cls+' '+(STCLS[val]||'')+'" '+attrs+'>'+o+'</select>';}

          +(opts?'<div class="l" style="padding-left:16px;color:var(--brand)">↳ 추가 옵션: '+opts.replace(/</g,'&lt;')+'</div>':'');}).join("")
    +'<div class="l small" style="margin-top:4px">등록자 심은선'+(s.agent?' · 에이전트 '+s.agent:'')+(s.manager?' · 담당 '+s.manager:'')+'</div>'
    +(s.notes?'<div class="l" style="margin-top:6px">📝 <b>메모:</b> '+s.notes.replace(/</g,'&lt;')+'</div>':'')

      + stSel('stsel',mSt?'':ov.status,'data-all="'+row.id+'"',mSt)

        + ov.dates.map(iso=>{const c=s.ws[row.id+'|'+iso]||{};
            return '<div class="drow"><span class="ddate">'+dstr(iso)+'</span>'
              + stSel('stsel',c.status||'','data-key="'+row.id+'|'+iso+'"',false)
              +'<div class="pbox"><span>฿</span><input type="number" class="pone" data-key="'+row.id+'|'+iso+'" placeholder="요금" value="'+(c.price||'')+'"></div></div>';
          }).join("")
        + '<div style="margin-top:8px"><div class="label">호텔 추가 옵션 (내용 · 단가 · 수량 · 합계, ฿)</div>'
            + (row.options||[]).map(o=>'<div class="optitem" style="margin-top:6px" data-wrid="'+row.id+'" data-woid="'+o.id+'"><div class="toprow"><input class="woptName" style="flex:1" value="'+esc(o.name)+'" placeholder="옵션 이름"><button class="del woptDel">−</button></div>'
                +'<div class="optline"><input type="number" class="woptAmt" value="'+(o.amt||'')+'" placeholder="단가"><span class="x">฿ ×</span><input type="number" class="woptQty qty" min="1" value="'+(o.qty||1)+'"><span class="linetot">= ฿'+won(lineTHB(o))+'</span></div></div>').join("")
            + '<button class="linkbtn woptAdd" data-id="'+row.id+'">+ 옵션 추가</button></div>'
        + '<div style="margin-top:8px"><button class="linkbtn memoTog" data-id="'+row.id+'">'+(row.memoOpen?'▾ 호텔 메모 접기':'▸ 호텔 메모 열기')+'</button>'
            + (row.memoOpen?'<textarea class="hnote" data-id="'+row.id+'" placeholder="특별 요청 / 호텔 회신 ...">'+(row.note||'').replace(/</g,'&lt;')+'</textarea>':'')+'</div>'

    +intro+cards+legend
    +'<p class="foot">호텔 선택·입력 후 펼쳐서 날짜별 상태·요금을 확인·입력하세요. 줄 요약값은 전체 날짜 일괄 적용됩니다.</p>'
    +'<button id="mkQuote" class="cta" style="background:var(--ink)">간단 견적 만들기 →</button></div>';
  bindWS();

function bindWS(){
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('select,input,textarea'))return;
    const id=Number(el.dataset.toggle);s.open.has(id)?s.open.delete(id):s.open.add(id);renderWS();});
  document.querySelectorAll('select.stsel[data-all]').forEach(sel=>sel.onchange=e=>{
    const id=Number(e.target.dataset.all),v=e.target.value;const row=s.rows.find(r=>r.id===id),i=s.rows.indexOf(row);
    rowDates(row,i).dates.forEach(iso=>{const k=id+'|'+iso;s.ws[k]=s.ws[k]||{};s.ws[k].status=v;});renderWS();});
  document.querySelectorAll('input.pall').forEach(inp=>inp.onchange=e=>{
    const id=Number(e.target.dataset.all),v=e.target.value;const row=s.rows.find(r=>r.id===id),i=s.rows.indexOf(row);
    rowDates(row,i).dates.forEach(iso=>{const k=id+'|'+iso;s.ws[k]=s.ws[k]||{};s.ws[k].price=v;});renderWS();});
  document.querySelectorAll('select.stsel[data-key]').forEach(sel=>sel.onchange=e=>{
    const k=e.target.dataset.key;s.ws[k]=s.ws[k]||{};s.ws[k].status=e.target.value;renderWS();});
  document.querySelectorAll('input.pone').forEach(inp=>{
    inp.oninput=e=>{const k=e.target.dataset.key;s.ws[k]=s.ws[k]||{};s.ws[k].price=e.target.value;};
    inp.onchange=()=>renderWS();});
  document.querySelectorAll('textarea.hnote').forEach(t=>t.oninput=e=>{const row=s.rows.find(r=>r.id===Number(e.target.dataset.id));if(row)row.note=e.target.value;});
  document.querySelectorAll('.memoTog').forEach(b=>b.onclick=()=>{const row=s.rows.find(r=>r.id===Number(b.dataset.id));if(row){row.memoOpen=!row.memoOpen;renderWS();}});
  document.querySelectorAll('.optitem[data-woid]').forEach(row=>{const rid=Number(row.dataset.wrid),oid=Number(row.dataset.woid);
    const r=s.rows.find(x=>x.id===rid),o=r&&(r.options||[]).find(x=>x.id===oid);if(!o)return;
    row.querySelector('.woptName').oninput=e=>{o.name=e.target.value;};
    row.querySelector('.woptAmt').onchange=e=>{o.amt=Number(e.target.value)||0;renderWS();renderQuote();};
    row.querySelector('.woptQty').onchange=e=>{o.qty=Math.max(1,Number(e.target.value)||1);renderWS();renderQuote();};
    row.querySelector('.woptDel').onclick=()=>{r.options=r.options.filter(x=>x.id!==oid);renderWS();renderQuote();};});
  document.querySelectorAll('.woptAdd').forEach(b=>b.onclick=()=>{const r=s.rows.find(x=>x.id===Number(b.dataset.id));r.options=r.options||[];r.options.push({id:Date.now(),name:'',qty:1,amt:0,show:true,memo:''});renderWS();renderQuote();});
}
/* ---------- 간단 견적 (전 항목 ฿ 계산 → 총합 × 환율 = 원화) ---------- */
const statusLabel=code=>({av:'AV',rq:'RQ',so:'S/O'})[code]||'–';
function encodeState(){const o={mode:s.mode,startDate:s.startDate,sharedNights:s.sharedNights,agent:s.agent,manager:s.manager,notes:s.notes,rows:s.rows,ws:s.ws,quote:s.quote,open:[...s.open]};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function buildURL(){return location.origin+location.pathname+'#q='+encodeState();}
function loadHash(){try{const m=(location.hash||'').match(/^#q=(.*)$/);if(!m)return false;const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));Object.assign(s,o);s.open=new Set(o.open||[]);return true;}catch(e){return false;}}
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const manwonF=m=>(Math.round((m||0)*10)/10).toLocaleString('ko-KR')+'만원';
const lineTHB=x=>(Number(x.amt)||0)*(Number(x.qty)||1);
const optLabel=o=>o.name?(o.name+(Number(o.qty)>1?(' '+o.qty+'회'):'')):'';
function hotelTHB(row,i){let t=0;rowDates(row,i).dates.forEach(iso=>{const c=s.ws[row.id+'|'+iso]||{};t+=(Number(c.price)||0)*Number(row.rooms);});return t;}
function hotelOptsList(){const l=[];s.rows.forEach(r=>(r.options||[]).forEach(o=>l.push({rid:r.id,hotel:r.hotel,o})));return l;}
function agentLine(){const p=[];if(s.agent)p.push('에이전트 '+s.agent);p.push('담당 '+(s.manager||'심은선'));return p.join(' · ');}
function quoteCalc(){
  const q=s.quote,rate=Number(q.rate)||0,pax=Math.max(1,Number(q.pax)||1);
  const perHotel=s.rows.map((r,i)=>({row:r,name:r.hotel||'-',thb:hotelTHB(r,i),showRate:!!r.showRate}));
  const hTHB=perHotel.reduce((a,x)=>a+x.thb,0);
  const optTHB=hotelOptsList().reduce((a,{o})=>a+lineTHB(o),0);
  const baseTHB=hTHB+optTHB;
  const addlKRW=q.addl.reduce((a,x)=>a+(x.cur==='krw'?lineTHB(x):lineTHB(x)*rate),0);
  const totalKRW=baseTHB*rate+addlKRW, per=totalKRW/pax;
  const perMan=q.override!=null?Number(q.override):per/10000;
  return {rate,pax,perHotel,hTHB,optTHB,baseTHB,addlKRW,totalKRW,per,perMan,totalMan:perMan*pax};}

function quoteText(){
  const c=quoteCalc();
  let t='The Nirvana · 여행 견적\n'+agentLine()+'\n';
  s.rows.forEach((row,i)=>{const d=rowDates(row,i);
    const sh=(row.options||[]).filter(o=>o.show&&o.name);
    const opts=sh.map(optLabel).join(', ');
    t+='\n'+(i+1)+') '+dstr(d.checkIn)+' → '+dstr(d.checkOut)+' ('+d.nights+'박)\n';
    t+=(row.hotel||'-')+'\n';
    t+=(row.roomType||'-')+' · '+row.rooms+'실'+(opts?'   '+opts:'')+'\n';
    if(row.showRate)t+='   호텔 요금 ₩'+won(hotelTHB(row,i)*c.rate)+'\n';
    sh.filter(o=>o.memo).forEach(o=>t+='· '+o.memo+'\n');});
  s.quote.addl.filter(x=>x.show&&(x.memo||x.desc)).forEach(x=>t+='· '+(x.memo||x.desc)+'\n');
  t+='\n견적금액 · 1인 '+manwonF(c.perMan)+'\n'+c.pax+'인 기준 '+manwonF(c.totalMan);
  return t;}

      +'<button id="ovrReset" class="curbtn" style="width:auto;padding:8px 12px">자동</button></div></div>'
    +'<div class="quotecard" id="quotecard"><div class="qc-title">The Nirvana · 여행 견적</div>'
      +'<div class="qc-sub" style="text-align:left;margin-top:3px">'+agentLine()+'</div>'
      +legs+(incLines?'<div class="qc-leg">'+incLines+'</div>':'')
      +'<hr class="qc-sep"><div class="qc-final"><span class="lbl">견적금액 · 1인</span><span class="amt">'+manwonF(c.perMan)+'</span></div>'
      +'<div class="qc-sub">'+c.pax+'인 기준 '+manwonF(c.totalMan)+'</div></div>'
    +'<div class="qbtns"><button class="qcopy" id="qCopy">📋 텍스트 복사</button><button class="qimg" id="qImg">🖼 이미지 저장</button></div>'
    +'<p class="foot">호텔·옵션은 ฿로 합산 후 환율로 환산하고, 추가 항목은 ฿/₩를 선택해 원화로 더합니다. 노출 메모는 견적 카드에 표시됩니다.</p>'
    // ===== 내부 견적 기록 (저장용) =====
    +'<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:10px"><button class="linkbtn" id="recTog">'+(s.recordOpen?'▾ 내부 견적 기록 (저장용) 접기':'▸ 내부 견적 기록 (저장용) 열기')+'</button>'
    + (s.recordOpen? recordHTML(c) + '<div class="qbtns"><button class="qcopy" id="recImg">📷 기록 이미지 저장</button><button class="qimg" id="recUrl">🔗 기록 URL 복사</button></div>'
       +'<p class="foot">기록에는 호텔 요금 상세·계산 내역·에이전트 발송 내용이 모두 포함됩니다. 이미지로 저장하거나 URL을 복사해 시스템에 보관하세요. (URL을 열면 이 견적이 그대로 복원됩니다.)</p>' : '')
    +'</div>'
    +'</div>';
  bindQuote();
}
function recordHTML(c){
  const detail=s.rows.map((row,i)=>{const d=rowDates(row,i);
    const dr=d.dates.map(iso=>{const cc=s.ws[row.id+'|'+iso]||{};return '<div class="brow" style="padding:2px 0"><span class="mono small">'+dstr(iso)+'</span><span class="mono small">'+statusLabel(cc.status)+' · ฿'+won(Number(cc.price)||0)+'</span></div>';}).join("");
    const optd=(row.options||[]).map(o=>'<div class="brow" style="padding:2px 0"><span class="small">· 옵션 '+optLabel(o).replace(/</g,'&lt;')+'</span><span class="mono small">฿'+won(lineTHB(o))+'</span></div>').join("");
    return '<div style="margin-top:8px"><div style="font-weight:800;font-size:13px">'+(i+1)+') '+(row.hotel||'-').replace(/</g,'&lt;')+' · '+(row.roomType||'-').replace(/</g,'&lt;')+' · '+row.rooms+'실</div>'
      +'<div class="small mono">'+dstr(d.checkIn)+' → '+dstr(d.checkOut)+' ('+d.nights+'박)</div>'+dr+optd
      +'<div class="brow" style="font-weight:700;border-top:1px dashed var(--line)"><span class="small">호텔 소계</span><span class="mono small">฿'+won(hotelTHB(row,i))+'</span></div></div>';}).join("");
  const calc='<div class="brow"><span>호텔 금액 합계</span><span class="mono">฿'+won(c.hTHB)+'</span></div>'
    +'<div class="brow"><span>호텔 추가 옵션 합계</span><span class="mono">฿'+won(c.optTHB)+'</span></div>'
    +'<div class="brow"><span>฿ 소계 × 환율 '+won(c.rate)+'</span><span class="mono">฿'+won(c.baseTHB)+' → ₩'+won(c.baseTHB*c.rate)+'</span></div>'
    +'<div class="brow"><span>추가 항목 (₩ 환산)</span><span class="mono">₩'+won(c.addlKRW)+'</span></div>'
    +'<div class="brow tot"><span>원화 총액 ('+c.pax+'인)</span><span class="mono">₩'+won(c.totalKRW)+'</span></div>'
    +'<div class="brow" style="color:var(--brand);font-weight:800"><span>최종 1인 견적</span><span class="mono">'+manwonF(c.perMan)+' (₩'+won(c.perMan*10000)+')</span></div>';
  const now=new Date();const ds=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
  return '<div class="quotecard" id="record" style="margin-top:10px">'
    +'<div class="qc-title">내부 견적 기록</div>'
    +'<div class="small" style="margin-top:3px">'+agentLine()+' · 등록자 심은선 · '+ds+'</div>'
    +'<div style="margin-top:10px;font-weight:800;font-size:13.5px">■ 호텔 요금 상세</div>'+detail
    +'<div style="margin-top:12px;font-weight:800;font-size:13.5px">■ 계산 내역</div><div style="margin-top:4px">'+calc+'</div>'
    +'<div style="margin-top:12px;font-weight:800;font-size:13.5px">■ 에이전트 발송 내용</div>'
    +'<pre style="white-space:pre-wrap;font-family:var(--sans);font-size:12.5px;line-height:1.6;margin:6px 0 0;color:var(--sub)">'+quoteText().replace(/</g,'&lt;')+'</pre></div>';
}
function bindQuote(){
  const el=id=>document.getElementById(id);
  el('qRate').onchange=e=>{s.quote.rate=Number(e.target.value)||0;renderQuote();};
  el('qPax').onchange=e=>{s.quote.pax=Math.max(1,Number(e.target.value)||1);renderQuote();};
  el('ovr').onchange=e=>{s.quote.override=Number(e.target.value)||0;renderQuote();};
  el('ovrReset').onclick=()=>{s.quote.override=null;renderQuote();};
  el('adAdd').onclick=()=>{s.quote.addl.push({id:Date.now(),desc:'',amt:0,qty:1,cur:'thb',show:true,memo:''});renderQuote();};
  document.querySelectorAll('[data-hrateid]').forEach(row=>{const rid=Number(row.dataset.hrateid),r=s.rows.find(x=>x.id===rid);
    row.querySelector('.hrateBtn').onclick=()=>{r.showRate=!r.showRate;renderQuote();};});
  document.querySelectorAll('.optitem[data-hoid]').forEach(row=>{const rid=Number(row.dataset.hrid),oid=Number(row.dataset.hoid);
    const r=s.rows.find(x=>x.id===rid),o=r&&(r.options||[]).find(x=>x.id===oid);if(!o)return;
    row.querySelector('.hoptAmt').onchange=e=>{o.amt=Number(e.target.value)||0;renderQuote();};
    row.querySelector('.hoptQty').onchange=e=>{o.qty=Math.max(1,Number(e.target.value)||1);renderQuote();};
    row.querySelector('.hoptShow').onclick=()=>{o.show=!o.show;renderQuote();};
    row.querySelector('.hoptMemo').oninput=e=>{o.memo=e.target.value;};});
  document.querySelectorAll('.optitem[data-aid]').forEach(row=>{const id=Number(row.dataset.aid),it=s.quote.addl.find(x=>x.id===id);
    row.querySelector('.adDesc').oninput=e=>{it.desc=e.target.value;};
    row.querySelector('.adAmt').onchange=e=>{it.amt=Number(e.target.value)||0;renderQuote();};
    row.querySelector('.adQty').onchange=e=>{it.qty=Math.max(1,Number(e.target.value)||1);renderQuote();};
    row.querySelector('.adCur').onchange=e=>{it.cur=e.target.value;renderQuote();};
    row.querySelector('.adShow').onclick=()=>{it.show=!it.show;renderQuote();};
    row.querySelector('.adMemo').oninput=e=>{it.memo=e.target.value;};
    row.querySelector('.adDel').onclick=()=>{s.quote.addl=s.quote.addl.filter(x=>x.id!==id);renderQuote();};});
  el('qCopy').onclick=()=>{const t=quoteText();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
      .then(()=>toast('견적 텍스트가 복사되었습니다')).catch(()=>{
        const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');toast('견적 텍스트가 복사되었습니다');}catch(e){toast('복사 실패 — 길게 눌러 복사하세요');}
        document.body.removeChild(ta);});};
  el('qImg').onclick=()=>{const node=el('quotecard');
    if(typeof html2canvas==='undefined'){toast('이미지 기능은 인터넷 연결 시 가능합니다');return;}
    html2canvas(node,{scale:2,backgroundColor:'#ffffff'}).then(cv=>{const a=document.createElement('a');a.download='견적.png';a.href=cv.toDataURL('image/png');a.click();toast('이미지를 저장했습니다');});};
  const rt=el('recTog');if(rt)rt.onclick=()=>{s.recordOpen=!s.recordOpen;renderQuote();};
  const ri=el('recImg');if(ri)ri.onclick=()=>{const node=el('record');
    if(typeof html2canvas==='undefined'){toast('이미지 기능은 인터넷 연결 시 가능합니다');return;}
    html2canvas(node,{scale:2,backgroundColor:'#ffffff'}).then(cv=>{const a=document.createElement('a');a.download='견적기록.png';a.href=cv.toDataURL('image/png');a.click();toast('기록 이미지를 저장했습니다');});};
  const ru=el('recUrl');if(ru)ru.onclick=()=>{const u=buildURL();
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject())
      .then(()=>toast('기록 URL이 복사되었습니다')).catch(()=>{
        const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');toast('기록 URL이 복사되었습니다');}catch(e){toast('복사 실패');}
        document.body.removeChild(ta);});};
}
let _tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(_tt);_tt=setTimeout(()=>t.style.opacity='0',1800);}

if(loadHash()){ render(); renderWS(); renderQuote(); }
else {
  s.ws={"1|2026-09-16":{status:"av",price:4200},"1|2026-09-17":{status:"av",price:4200},"1|2026-09-18":{status:"av",price:4200},
        "2|2026-09-19":{status:"rq",price:8500},"2|2026-09-20":{status:"av",price:8900}};
  render(); renderWS(); renderQuote();
}
</script>
</body>
</html>
