<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>너바나 · 회원정보</title>
<link rel="stylesheet" href="style.css?v=20260801e" />
<style>
.wrap{max-width:470px}
.field{margin-top:12px}
.ro{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14.5px;font-weight:700;color:var(--sub)}
.msg{margin-top:12px;font-size:13px;font-weight:700;padding:10px 12px;border-radius:9px;display:none;line-height:1.5}
.msg.err{background:var(--soBg);color:var(--so);display:block}
.msg.ok{background:var(--avBg);color:var(--av);display:block}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.backbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.sechead2{font-size:14.5px;font-weight:800;margin:2px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdrtop">
      <div class="hdrbrand" style="cursor:pointer" onclick="location.href='login.html'" title="기본 페이지로 이동">
        <img src="logo.png?v=20260730" class="hdrlogo" alt="THE NIRVANA">
      </div>
      <div style="display:flex;gap:8px;align-items:center;justify-content:flex-end">
        <div id="langSelector" style="display:flex;gap:5px">
          <button data-lang="ko" class="langbtn on" style="padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">한글</button>
          <button data-lang="en" class="langbtn" style="padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">EN</button>
          <button data-lang="th" class="langbtn" style="padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">TH</button>
        </div>
        <span class="pagechip pc-agent" id="nameChip"></span><button class="backbtn" id="back" data-i="back">← 돌아가기</button>
      </div>
    </div>
    <p class="lede" data-i="lede">회원정보를 확인하고 수정합니다.</p>
  </header>
  <section class="card">
    <div class="sechead2" data-i="title">회원정보</div>
    <div class="field"><div class="label" data-i="name">이름</div><div class="ro" id="vName">-</div><input id="nameInput" style="display:none" placeholder="이름 (한글이름)"></div>
    <div class="field"><div class="label" data-i="acct">계정</div><div class="ro" id="vAcct">-</div></div>
    <div class="field"><div class="label" data-i="nickname">닉네임</div><input id="nickname" placeholder="표시용 닉네임 (선택사항)"></div>
    <div class="field" id="fEmail"><div class="label" data-i="email">이메일</div><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><div class="label" data-i="phone">연락처 (전화번호)</div><input id="phone" autocomplete="tel" placeholder="+66 ..."></div>
    <div class="field"><div class="label" data-i="bank">은행 계좌</div><input id="bank" placeholder="은행명 + 계좌번호 (선택사항)"></div>
    <div class="field" id="fAgentCompany" style="display:none"><div class="label" data-i="agent_company">소속 에이전트 (회사)</div><input id="agentCompany" placeholder="에이전시 회사명 — 이직 시 변경하세요"></div>
    <div class="field" id="regionField" style="display:none"><div class="label" data-i="region">관할지역</div><select id="region"><option value="">선택 안 함</option><option value="krabi">카오락 + 푸켓</option><option value="bangkok">방콕 + 파타야</option></select></div>
    <button class="cta" id="save" data-i="save">저장</button>
    <div class="msg" id="msg1"></div>
  </section>
  <section class="card" id="pwCard">
    <div class="sechead2" data-i="pw_title">비밀번호 변경</div>
    <div id="pwForm">
      <div class="field"><div class="label" data-i="cur_pw">현재 비밀번호</div><input id="curPw" type="password" autocomplete="current-password"></div>
      <div class="field"><div class="label" data-i="new_pw">새 비밀번호 (6자 이상)</div><input id="newPw" type="password" autocomplete="new-password"></div>
      <button class="cta" id="pwBtn" data-i="pw_btn">비밀번호 변경</button>
    </div>
    <div class="note" id="extNote" style="display:none" data-i="ext_note">부계정도 이 사이트의 비밀번호를 변경할 수 있습니다. 처음 변경할 때 '현재 비밀번호'는 너바나에서 발급받은 비밀번호를 입력하세요.</div>
    <div class="msg" id="msg2"></div>
  </section>
  <section class="card" id="tgCard" style="display:none">
    <div class="sechead2">📲 텔레그램 연결</div>
    <p class="small" style="margin:0 0 12px">Telegram을 통해 알림을 받을 수 있습니다.</p>
    <div id="tgStatus"></div>
    <div id="tgForm" style="display:none">
      <button class="cta" id="tgLink">텔레그램 연결 링크 생성</button>
      <div class="msg" id="tgMsg" style="display:none;margin-top:10px;font-size:13px;font-weight:700;padding:10px 12px;border-radius:9px"></div>
    </div>
    <div id="tgConnected" style="display:none">
      <p class="small" style="color:var(--av);margin:0 0 10px">✓ 텔레그램이 연결되었습니다.</p>
      <button class="backbtn" id="tgDisconnect">연결 해제</button>
    </div>
  </section>
</div>

 tg_title:"📲 เชื่อมต่อ Telegram",tg_desc:"รับการแจ้งเตือนผ่าน Telegram",tg_link:"สร้างลิงค์เชื่อมต่อ",tg_connected:"✓ เชื่อมต่อ Telegram แล้ว",tg_disconnect:"ยกเลิกการเชื่อมต่อ",tg_not_connected:"ยังไม่ได้เชื่อมต่อ",tg_link_copied:"คัดลอกลิงค์ Telegram แล้ว",tg_link_desc:"เปิดลิงค์ใน Telegram เพื่อเชื่อมต่อ:",tg_link_failed:"ไม่สามารถสร้างลิงค์ได้",tg_confirm_disconnect:"ยกเลิกการเชื่อมต่อ Telegram หรือ?",tg_disconnect_failed:"ไม่สามารถยกเลิกการเชื่อมต่อได้"}};
let L='ko', ME=null;
const $=id=>document.getElementById(id);
function tr(){
  const d=LD[L];
  document.querySelectorAll('[data-i]').forEach(el=>{if(d[el.dataset.i])el.textContent=d[el.dataset.i];});
  fillAcct();
  // placeholder 텍스트 업데이트
  if($('nameInput'))$('nameInput').placeholder=d.ph_name;
  if($('nickname'))$('nickname').placeholder=d.ph_nickname;
  if($('bank'))$('bank').placeholder=d.ph_bank;
  // select option 업데이트
  const regionSelect=$('region');
  if(regionSelect){
    const currentValue=regionSelect.value;
    regionSelect.innerHTML='<option value="">'+d.region_none+'</option><option value="krabi">'+d.region_krabi+'</option><option value="bangkok">'+d.region_bangkok+'</option>';
    regionSelect.value=currentValue;
  }
  // 텔레그램 섹션 텍스트 업데이트
  const tgTitle=document.querySelector('#tgCard .sechead2');
  if(tgTitle)tgTitle.textContent=d.tg_title||tgTitle.textContent;
  const tgDescP=document.querySelector('#tgCard .small');
  if(tgDescP)tgDescP.textContent=d.tg_desc||tgDescP.textContent;
  const tgLink=$('tgLink');
  if(tgLink)tgLink.textContent=d.tg_link||tgLink.textContent;
  const tgConnected=document.querySelector('#tgConnected .small');
  if(tgConnected)tgConnected.textContent=(d.tg_connected||tgConnected.textContent);
  const tgDisconnect=$('tgDisconnect');
  if(tgDisconnect)tgDisconnect.textContent=d.tg_disconnect||tgDisconnect.textContent;
  // tgStatus 업데이트 (연결되지 않은 상태)
  if(ME && !ME.tg){
    const tgStatus=$('tgStatus');
    if(tgStatus) tgStatus.innerHTML='<p class="small" style="color:var(--muted);margin:0">'+d.tg_not_connected+'</p>';
  }
}
function showMsg(id,kind,key){const m=$(id);m.className='msg '+kind;m.textContent=LD[L][key]||key;}
function fillAcct(){if(!ME)return;const d=LD[L];
  $('vAcct').textContent=ME.ext?(d.agency_acct+' · '+((ME.agency&&ME.agency.login_id)||'')):(d['role_'+ME.role]||ME.role);}
$('back').onclick=()=>{
  // 브라우저 히스토리가 있으면 실제 이전 페이지로 돌아가고, 없으면 역할별 페이지로 이동
  if(window.history.length>1){
    window.history.back();
  }else{
    const page={agent:'agent.html',sreq:'request.html',schk:'check.html',admin:'admin.html'}[ME?ME.role:'']||'login.html';
    location.href=page;
  }
};
// 언어 선택 버튼 핸들러
document.querySelectorAll('.langbtn').forEach(btn=>{
  btn.onclick=async()=>{
    const newLang=btn.dataset.lang;
    L=newLang;
    tr();
    // 서버에도 저장
    try{
      await fetch('api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:newLang})});
      ME.lang=newLang;
    }catch(e){}
    // 버튼 상태 업데이트
    document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.lang===newLang));
  };
});
(async()=>{
  try{
    const r=await fetch('api/me',{cache:'no-store'});const j=await r.json();
    if(!j.user){location.href='login.html';return;}
    ME=j.user;
    if(ME.lang&&LD[ME.lang])L=ME.lang;
    // 역할별 배색: 로그인한 사용자의 실제 역할에 맞춰 --brand를 동적으로 지정 (2026-07-22, 사이트 전체 배색 일관성 정리)
    const ROLE_BRAND={sreq:'#2B5FA3',schk:'#B07908',admin:'#54406E'};
    if(ROLE_BRAND[ME.role]) document.documentElement.style.setProperty('--brand',ROLE_BRAND[ME.role]);
    $('nameChip').textContent=ME.nickname||(ME.agency&&ME.agency.nickname)||ME.name; // 닉네임 우선
    $('nameChip').className='pagechip pc-'+ME.role;
    $('vName').textContent=ME.name;
    if(ME.role==='admin'){$('vName').style.display='none';$('nameInput').style.display='';$('nameInput').value=ME.name||'';} // 관리자는 이름 수정 가능
    $('email').value=ME.email||'';
    $('phone').value=ME.phone||'';
    $('nickname').value=ME.nickname||'';
    $('bank').value=ME.bank_account||'';
    /* 소속 에이전트 (2026-07-30): 에이전트 역할에만 표시 — 기본값은 API 소속, 이직 시 직접 변경 */
    if(ME.role==='agent'){
      $('fAgentCompany').style.display='';
      $('agentCompany').value=ME.agent_company||'';
      if(!ME.agent_company&&ME.agency&&ME.agency.idx){
        fetch('api/agencies/'+ME.agency.idx,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
          const nm=j&&j.agency&&j.agency.agency&&j.agency.agency.name;
          if(nm&&!$('agentCompany').value)$('agentCompany').value=nm;
        }).catch(()=>{});
      }
    }
    // 직원(sreq/schk)과 관리자는 지역 선택 가능 (에이전트만 표시 안 함)
    if(ME.role==='sreq'||ME.role==='schk'||ME.role==='admin'){
      $('regionField').style.display='';
      if(ME.region) $('region').value=ME.region;
    }else{
      $('regionField').style.display='none';
    }
    if(ME.ext){
      $('fEmail').style.display='none'; // 내부용 합성 이메일 숨김
      /* 2026-07-30: 부계정도 이 사이트의 비밀번호 변경 가능 — pwForm 숨김 제거 */
      $('extNote').style.display='block';
    }
    // 텔레그램 연결 UI (요청자/확인자/승격된 관리자에게만 표시)
    const showTG = ME.role==='sreq'||ME.role==='schk'||(ME.role==='admin'&&!ME.super);
    if(showTG){
      $('tgCard').style.display='';
      if(ME.tg){
        $('tgConnected').style.display='';
        $('tgForm').style.display='none';
        $('tgStatus').innerHTML='';
      }else{
        $('tgForm').style.display='';
        $('tgConnected').style.display='none';
        $('tgStatus').innerHTML='<p class="small" style="color:var(--muted);margin:0">'+LD[L].tg_not_connected+'</p>';
      }
    }
    tr();
  }catch(e){location.href='login.html';}
})();
$('save').onclick=async()=>{
  const body={phone:$('phone').value.trim(),nickname:$('nickname').value.trim(),bank_account:$('bank').value.trim()};
  if(ME.role==='agent')body.agent_company=$('agentCompany').value.trim(); /* 소속 에이전트 저장 (2026-07-30) */
  if(ME.role==='admin'){const nm=$('nameInput').value.trim();if(nm)body.name=nm;} // 관리자 이름 수정
  if(!ME.ext){const em=$('email').value.trim();if(em&&em!==ME.email)body.email=em;}
  // 직원·관리자: 지역 정보도 함께 저장
  if(ME.role==='sreq'||ME.role==='schk'||ME.role==='admin'){body.region=$('region').value;}
  try{
    const r=await fetch('api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.ok){ME=j.user||ME;showMsg('msg1','ok','saved');return;}
    showMsg('msg1','err',j.error||'noserver');
  }catch(e){showMsg('msg1','err','noserver');}
};
$('pwBtn').onclick=async()=>{
  const cur=$('curPw').value,nw=$('newPw').value;
  if(nw.length<6){showMsg('msg2','err','weak_password');return;}
  try{
    const r=await fetch('api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cur_password:cur,new_password:nw})});
    const j=await r.json();
    if(j.ok){$('curPw').value='';$('newPw').value='';showMsg('msg2','ok','pw_saved');return;}
    showMsg('msg2','err',j.error||'noserver');
  }catch(e){showMsg('msg2','err','noserver');}
};
$('tgLink').onclick=async()=>{
  const d=LD[L];
  try{
    const r=await fetch('api/tg-link',{cache:'no-store'});const j=await r.json();
    if(j.ok&&j.url){
      navigator.clipboard.writeText(j.url);
      const m=$('tgMsg');m.className='msg ok';m.style.display='block';m.innerHTML='<strong>'+d.tg_link_copied+'</strong><br>'+d.tg_link_desc+'<br><code style="font-family:monospace;font-size:11px;word-break:break-all">'+j.url+'</code>';
      return;
    }
    const m=$('tgMsg');m.className='msg err';m.style.display='block';m.textContent=j.message||d.tg_link_failed;
  }catch(e){
    const m=$('tgMsg');m.className='msg err';m.style.display='block';m.textContent=d.noserver;
  }
};
$('tgDisconnect').onclick=async()=>{
  const d=LD[L];
  if(!confirm(d.tg_confirm_disconnect))return;
  try{
    const r=await fetch('api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tg_unlink:true})});
    const j=await r.json();
    if(j.ok){ME=j.user||ME;location.reload();return;}
    alert(d.tg_disconnect_failed);
  }catch(e){alert(d.noserver);}
};
</script>
</body>
</html>
