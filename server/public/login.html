<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>룸 체크 · 로그인</title>
<link rel="stylesheet" href="style.css?v=20260830d" />
<style>
body{background:#F3F5FA}
.wrap{max-width:440px}
.lg-head{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
.lg-head img{width:60px;height:60px;object-fit:contain;border-radius:12px}
.lg-brand{font-size:20px;font-weight:800;color:#1F3A66;line-height:1.15}
.lg-sub{margin:3px 0 0;font-size:13px;color:#8A93A5;font-weight:600}
.lg-card{background:#fff;border:1px solid #E6E9F2;border-radius:20px;padding:26px 24px;box-shadow:0 12px 34px rgba(20,40,80,.07)}
.lg-field{margin-bottom:16px}
.lg-label{font-size:14px;font-weight:800;color:#2A3350;margin-bottom:8px}
.lg-input{width:100%;box-sizing:border-box;border:1.5px solid #D7DDE9;border-radius:12px;padding:14px 16px;font-size:15px;background:#fff;color:#1B2340;transition:border-color .15s,box-shadow .15s}
.lg-input:focus{outline:none;border-color:#1F3A66;box-shadow:0 0 0 3px rgba(31,58,102,.10)}
.lg-check{display:flex;align-items:center;gap:10px;margin:2px 0 20px;font-size:14px;font-weight:700;color:#3A4360;cursor:pointer;user-select:none}
.lg-check input{position:absolute;opacity:0;width:0;height:0}
.lg-box{width:23px;height:23px;border:2px solid #C4CBD9;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.lg-box svg{opacity:0;transition:.15s}
.lg-check input:checked + .lg-box{background:#1F3A66;border-color:#1F3A66}
.lg-check input:checked + .lg-box svg{opacity:1}
.lg-check input:focus-visible + .lg-box{box-shadow:0 0 0 3px rgba(31,58,102,.18)}
.lg-btn{width:100%;border:none;background:#1F3A66;color:#fff;font-size:16px;font-weight:800;padding:16px;border-radius:12px;cursor:pointer;transition:background .15s}
.lg-btn:hover{background:#16294A}
.lg-btn:active{transform:translateY(1px)}
.lg-links{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px}
.lg-links a{color:#2A3350;font-weight:800;font-size:14.5px;text-decoration:none;cursor:pointer}
.lg-links a:hover{color:#1F3A66;text-decoration:underline}
.lg-links .dot{color:#C4CBD9;font-weight:800}
.lg-agency{text-align:center;margin-top:14px}
.lg-agency a{color:#7C8AA5;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.lg-agency a:hover{color:#1F3A66}
.lg-lang{text-align:center;margin-top:14px}
.lg-lang a{color:#5E7EA9;font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.lg-lang a:hover{color:#1F3A66}
.lg-langopts{display:none;justify-content:center;gap:8px;margin-top:11px}
.lg-langopts.on{display:flex}
.lg-langopts button{border:1.5px solid #D7DDE9;background:#fff;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;color:#3A4360;cursor:pointer}
.lg-langopts button.on{background:#1F3A66;color:#fff;border-color:#1F3A66}
.msg{margin-top:16px;font-size:13.5px;font-weight:700;padding:11px 13px;border-radius:10px;display:none;line-height:1.5;text-align:center}
.msg.err{background:#FDEDED;color:#C0392B;display:block}
.msg.ok{background:#EAF7EE;color:#1E7B45;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="lg-head">
    <img src="logo.png?v=20260823" alt="THE NIRVANA">
    <div>
      <div class="lg-brand">THE NIRVANA</div>
      <p class="lg-sub" data-i="lede">로그인 후 이용할 수 있습니다.</p>
    </div>
  </div>
  <section class="lg-card">
    <div class="lg-field" id="fEmail">
      <div class="lg-label" data-i="idlabel">아이디</div>
      <input class="lg-input" id="email" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="lg-field">
      <div class="lg-label" data-i="pw">비밀번호</div>
      <input class="lg-input" id="pw" type="password" autocomplete="current-password">
    </div>
    <label class="lg-check">
      <input type="checkbox" id="remember">
      <span class="lg-box"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2l2.6 2.6L10 3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span data-i="autologin">자동 로그인</span>
    </label>
    <button class="lg-btn" id="go" data-i="login">로그인</button>
    <div class="lg-links">
      <a id="lnkJoin" data-i="join">회원가입</a>
      <span class="dot">·</span>
      <a id="lnkFind" data-i="findpw">비밀번호 찾기</a>
    </div>
    <div class="lg-lang"><a id="lnkLang"><span>🌐</span><span data-i="langchange">언어 변경</span></a></div>
    <div class="lg-langopts" id="langOpts">
      <button data-lang="ko">한국어</button>
      <button data-lang="en">English</button>
      <button data-lang="th">ไทย</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>
</div>
<script>
const LD={
ko:{lede:"로그인 후 이용할 수 있습니다.",idlabel:"아이디",aid:"에이전시 아이디",pw:"비밀번호",autologin:"자동 로그인",login:"로그인",join:"회원가입",findpw:"비밀번호 찾기",agencylogin:"에이전시 로그인",backlogin:"일반 로그인",langchange:"언어 변경",
 findpw_notice:"비밀번호는 니르바나 담당자에게 문의해 주세요. 에이전시 부계정은 니르바나에서 다시 발급해 드립니다.",closed:"🚧 회원가입은 준비중입니다. 관리자에게 문의해주세요.",
 bad:"아이디 또는 비밀번호가 올바르지 않습니다.",pending:"관리자 승인 대기 중입니다. 승인 후 이용할 수 있습니다.",rejected:"가입이 거절된 계정입니다. 관리자에게 문의하세요.",noserver:"서버에 연결할 수 없습니다.",
 ainput:"에이전시 아이디와 비밀번호를 입력해주세요.",abad:"아이디 또는 비밀번호가 일치하지 않습니다.",aoff:"에이전시 로그인이 아직 설정되지 않았습니다. 관리자에게 문의해주세요.",aerr:"인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.",
 needinput:"아이디와 비밀번호를 입력해주세요."},
en:{lede:"Please log in to continue.",idlabel:"ID",aid:"Agency ID",pw:"Password",autologin:"Keep me logged in",login:"Log in",join:"Sign up",findpw:"Forgot password",agencylogin:"Agency login",backlogin:"Standard login",langchange:"Language",
 findpw_notice:"Please contact your Nirvana representative. Agency sub-account passwords are reissued by Nirvana.",closed:"🚧 Sign-up is not open yet. Please contact the administrator.",
 bad:"Incorrect ID or password.",pending:"Awaiting admin approval.",rejected:"This account was rejected. Contact the administrator.",noserver:"Cannot reach the server.",
 ainput:"Please enter your agency ID and password.",abad:"Incorrect ID or password.",aoff:"Agency login is not configured yet. Please contact the administrator.",aerr:"Cannot reach the authentication server. Please try again later.",
 needinput:"Please enter your ID and password."},
th:{lede:"กรุณาเข้าสู่ระบบ",idlabel:"ไอดี",aid:"ไอดีเอเจนซี",pw:"รหัสผ่าน",autologin:"จดจำการเข้าสู่ระบบ",login:"เข้าสู่ระบบ",join:"สมัครสมาชิก",findpw:"ลืมรหัสผ่าน",agencylogin:"เข้าสู่ระบบเอเจนซี",backlogin:"เข้าสู่ระบบปกติ",langchange:"เปลี่ยนภาษา",
 findpw_notice:"กรุณาติดต่อผู้ดูแลของ Nirvana รหัสผ่านบัญชีย่อยจะออกใหม่โดย Nirvana",closed:"🚧 ยังไม่เปิดรับสมัครสมาชิก กรุณาติดต่อผู้ดูแลระบบ",
 bad:"ไอดีหรือรหัสผ่านไม่ถูกต้อง",pending:"รอผู้ดูแลอนุมัติ",rejected:"บัญชีนี้ถูกปฏิเสธ กรุณาติดต่อผู้ดูแล",noserver:"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",
 ainput:"กรุณากรอกไอดีเอเจนซีและรหัสผ่าน",abad:"ไอดีหรือรหัสผ่านไม่ถูกต้อง",aoff:"ยังไม่ได้ตั้งค่าการเข้าสู่ระบบเอเจนซี กรุณาติดต่อผู้ดูแล",aerr:"เชื่อมต่อเซิร์ฟเวอร์ยืนยันตัวตนไม่ได้ กรุณาลองใหม่ภายหลัง",
 needinput:"กรุณากรอกไอดีและรหัสผ่าน"}};
let L='ko';
const $=id=>document.getElementById(id);
function tr(){const d=LD[L];document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(d[k])el.textContent=d[k];});
  document.querySelectorAll('#langOpts button').forEach(b=>b.classList.toggle('on',b.dataset.lang===L));}
function showMsg(kind,key){const m=$('msg');m.className='msg '+kind;m.textContent=LD[L][key]||key;}
$('lnkJoin').onclick=()=>showMsg('err','closed');
$('lnkFind').onclick=()=>showMsg('ok','findpw_notice');
$('lnkLang').onclick=()=>$('langOpts').classList.toggle('on');
document.querySelectorAll('#langOpts button').forEach(b=>b.onclick=()=>{L=b.dataset.lang;tr();$('langOpts').classList.remove('on');});
$('go').onclick=async()=>{
  const email=$('email').value.trim(), pw=$('pw').value;
  if(!email||!pw){showMsg('err','needinput');return;}
  try{
    const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:pw,remember:$('remember').checked})});
    const j=await r.json();
    if(j.ok){const page={agent:'agent.html',sreq:'request.html',schk:'check.html',admin:'admin.html'}[j.user.role]||'index.html';
      location.href=page;return;}
    if(j.error==='pending'){showMsg('err','pending');return;}
    if(j.error==='rejected'){showMsg('err','rejected');return;}
    // 일반 로그인 실패 → 에이전시 계정으로 재시도 (통합 로그인)
    const r2=await fetch('api/agency-login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login_id:email,password:pw})});
    const j2=await r2.json();
    if(j2.ok){location.href='agent.html';return;}
    showMsg('err','bad');
  }catch(e){showMsg('err','noserver');}
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
tr();
</script>
</body>
</html>
