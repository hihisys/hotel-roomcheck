<script>
/* ===== 긴급 수정: UI/Draft 초기화 보장 (2026-08-17 인라인) =====
   배포 지연 시에도 작동하도록 독립적으로 초기화를 실행한다. */
(function() {
  let attempts = 0;
  const maxAttempts = 20;
  const initCheck = setInterval(function() {
    attempts++;
    if (typeof window.newDraft === 'function' && typeof window.renderApp === 'function') {
      clearInterval(initCheck);
      if (typeof window.ui === 'undefined') {
        window.ui = {
          role: (typeof PAGE !== 'undefined' ? PAGE : 'agent'),
          sel: null, ssel: null, notesOpen: false, open: new Set(),
          optOpen: new Set(), hnOpen: new Set(), qOpen: false,
          pastOpen: false, conOpen: false, qbOpen: null, phAdd: new Set()
        };
      }
      if (typeof window.draft === 'undefined') {
        window.draft = window.newDraft();
      }
      if (typeof window.renderApp === 'function') {
        try { window.renderApp(); } catch (e) { console.warn('renderApp 오류:', e.message); }
      }
      return;
    }
    if (attempts >= maxAttempts) {
      clearInterval(initCheck);
      console.warn('초기화 타임아웃');
    }
  }, 100);
})();
</script>
